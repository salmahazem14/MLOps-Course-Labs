name: Deploy to Churn Prediction to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
        
      - name: Set up Python 
       uses : actions/setup-python@v5
       with:
        python-version : "3.11"
  
      - name: Install Requirements File 
        run: | 
          pip install -r requirements.txt 
          
      - name: Validate model
        run: |
          python -c "import joblib; joblib.load('rf_model.pkl')"
          python -c "import joblib; joblib.load('column_transformer.pkl')"

      - name: Build Docker Image 
        run : |
          docker build -t chrun-image:latest .
      
          

    
  
  
